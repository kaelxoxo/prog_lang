topic: "Improving Medication Extraction Accuracy in Alaga (Tesseract.js Baseline vs Multimodal Vision & On-Device Approaches)"
execution:
  batch_size: 2
  items_per_agent: 2
  output_dir: ./results
items:
  - name: Tesseract_js_Baseline
    category: Current Implementation
    description: Alaga's existing local Node.js LSTM OCR engine running eng+fil language models, paired with deterministic regex heuristic parsers for dosages, intervals, meal timing, and multi-draft splitting.
  - name: Google_Gemini_3_7_Flash
    category: Cloud Multimodal VLM
    description: Google's low-latency multimodal reasoning model supporting native JSON Schema structured outputs and document/image understanding, benchmarked under synthetic health data constraints.
  - name: Google_ML_Kit_Text_Recognition
    category: On-Device Mobile Vision
    description: Google's hardware-accelerated on-device machine learning vision SDK for Android and iOS, providing offline text recognition with zero network latency and complete patient privacy.
  - name: Apple_Vision_Framework
    category: On-Device Mobile Vision
    description: Apple's native VNRecognizeTextRequest running on the Apple Neural Engine (ANE) on iOS, featuring native Latin and handwriting recognition with 0 MB app bundle overhead.
  - name: Decoupled_OnDevice_OCR_and_Local_SLM
    category: Hybrid Edge Pipeline
    description: Two-stage on-device pipeline combining fast character recognition (ML Kit / Apple Vision) with a quantized local small language model (Llama-3.2-1B / Qwen2.5-0.5B via ExecuTorch or ONNX) for semantic schedule extraction.
  - name: Edge_Vision_Language_Models
    category: Edge Multimodal VLM
    description: Quantized small vision-language foundation models (Qwen2.5-VL-3B, PaliGemma 2, SmolVLM) deployed locally or on edge gateway servers for direct end-to-end multimodal extraction.
  - name: Computer_Vision_Preprocessing_and_Dewarping
    category: Computer Vision Pre-Processing
    description: Classical and neural computer vision pre-processing pipelines, including OpenCV/Sharp adaptive binarization, CLAHE contrast enhancement, 3D cylindrical label unwrapping (DocTr), and specular glare suppression.
  - name: Formulary_Grounding_and_LASA_PostProcessor
    category: Deterministic Post-Processing
    description: Medical validation layer integrating Philippine National Drug Formulary (PNDF) and RxNorm dictionary grounding with SymSpell phonetic distance matching to detect Look-Alike/Sound-Alike errors and optical confusions.
